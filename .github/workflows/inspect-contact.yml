name: Inspect contact section
on:
  push:
    paths: ['.github/workflows/inspect-contact.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save contact markup
        shell: python
        run: |
          from pathlib import Path
          t = Path('index.html').read_text()
          i = t.find('<!-- CTA')
          chunk = t[i:] if i != -1 else t[-6000:]
          Path('debug-contact.txt').write_text(chunk)
      - name: Commit diagnostic file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug-contact.txt
          git commit -m 'Save contact markup for inspection'
          git push
