name: Deploy static content to Pages
on:
  push:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest committed website
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate subject catalogue
        shell: python
        run: |
          from pathlib import Path
          text = Path('index.html').read_text()
          for ident in ('business-commerce-support', 'writing-project-support', 'geography-support'):
              assert 'id="' + ident + '"' in text, 'Missing catalogue card: ' + ident
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare clean static website
        run: |
          mkdir -p /tmp/skolaritus-site
          cp index.html /tmp/skolaritus-site/index.html
          cp -R images /tmp/skolaritus-site/images
          touch /tmp/skolaritus-site/.nojekyll
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/skolaritus-site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Record published URL
        run: |
          echo 'Website deployment completed: ${{ steps.deployment.outputs.page_url }}' >> "$GITHUB_STEP_SUMMARY"
