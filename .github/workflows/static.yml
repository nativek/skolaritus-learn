name: Deploy static content to Pages
on:
  push:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest committed website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Validate subject catalogue
        shell: python
        run: |
          from pathlib import Path
          text = Path('index.html').read_text()
          for ident in ('business-commerce-support', 'writing-project-support', 'geography-support'):
              assert 'id="' + ident + '"' in text, 'Missing catalogue card: ' + ident
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Prepare clean static website
        run: |
          mkdir -p /tmp/skolaritus-site
          cp index.html /tmp/skolaritus-site/index.html
          cp -R images /tmp/skolaritus-site/images
          touch /tmp/skolaritus-site/.nojekyll
      - name: Upload website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: /tmp/skolaritus-site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Record published URL
        run: |
          echo 'Website deployment completed: ${{ steps.deployment.outputs.page_url }}' >> "$GITHUB_STEP_SUMMARY"
